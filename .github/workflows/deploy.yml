name: JobFlow AI CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax and Imports
        run: |
          python -m py_compile main.py agent.py llm.py database.py start_server.py
          python -c "import database; import main; print('Syntax & Imports Validated Successfully!')"

  deploy:
    name: Deploy to Render
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository secrets. Deployment skipped."
            echo "To enable automatic deployment, add RENDER_DEPLOY_HOOK_URL to your GitHub Repo -> Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "Deploying to Render via Deploy Hook..."
          response=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          echo "Render Response Code: $http_code"
          echo "Render Response Body: $body"
          if [ "$http_code" -ne 200 ] && [ "$http_code" -ne 201 ]; then
            echo "::error ::Render deployment hook failed with status code $http_code"
            exit 1
          fi
          echo "Render deployment triggered successfully!"

